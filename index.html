<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jonas Strassel</title>
    <meta name="description" content="Developer. Hired gun. Miracle worker. Utterly useless without a keyboard." />
    <meta name="author" content="Jonas Strassel" />

    <!-- Mobile Specific Metas
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- FONT
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <link rel="preload" as="font" />
    <link rel="stylesheet" href="css/fonts.css" />

    <!-- CSS
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <link rel="stylesheet" href="css/normalize.min.css" />

    <!-- Themes:
         Auto:   css/skeleton-auto.css
         Light:  css/skeleton-light.css
         Dark:   css/skeleton-dark.css
  -->
    <link rel="stylesheet" href="css/skeleton-auto.css" />

    <link rel="stylesheet" href="css/brands.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

    <style>
      body {
        background-color: #0a0a0f;
        color: #f0c040;
        font-family: "Press Start 2P", monospace;
        font-size: 12px;
        line-height: 22px;
      }

      /* CRT scanline overlay */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.15) 2px,
          rgba(0, 0, 0, 0.15) 4px
        );
        pointer-events: none;
        z-index: 9999;
      }

      h1 {
        font-family: "Press Start 2P", monospace;
        font-size: 20px;
        line-height: 36px;
        letter-spacing: 2px;
      }

      @media (min-width: 550px) {
        h1 {
          font-size: 28px;
          line-height: 48px;
        }
      }

      p {
        font-size: 10px;
        line-height: 20px;
        color: #d0a030;
      }

      .gradient-name {
        background: linear-gradient(90deg, #f0c040, #d060b0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: none;
        filter: drop-shadow(0 0 8px rgba(240, 192, 64, 0.5));
      }

      /* Pixel glow on avatar */
      img[alt="Picture of Jonas Strassel"] {
        border-radius: 50%;
        box-shadow: 0 0 0 3px #f0c040, 0 0 20px rgba(240, 192, 64, 0.4);
        image-rendering: pixelated;
      }

      /* Retro button overrides */
      .button {
        font-family: "Press Start 2P", monospace;
        font-size: 9px;
        border-radius: 0;
        border: 2px solid #f0c040;
        color: #f0c040;
        background: transparent;
        letter-spacing: 1px;
        transition: background 0.1s, color 0.1s, box-shadow 0.1s;
      }
      .button:hover {
        background: #f0c040;
        color: #0a0a0f;
        box-shadow: 0 0 12px rgba(240, 192, 64, 0.7);
      }

      a {
        color: #f0c040;
      }
      a:hover {
        color: #d060b0;
      }
    </style>

    <!-- Favicon
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon-16x16.png"
    />
    <link rel="manifest" href="assets/site.webmanifest" />
    <link rel="mask-icon" href="assets/safari-pinned-tab.svg" color="#5bbad5" />
    <script src="https://formspree.io/js/formbutton-v1.min.js" defer></script>
    <script>
      /* paste this line in verbatim */
      window.formbutton =
        window.formbutton ||
        function () {
          (formbutton.q = formbutton.q || []).push(arguments);
        };
      /* customize formbutton below*/
      formbutton("create", {
        action: "https://formspree.io/f/info@jonas-strassel.de",
        title: "How can I help?",
        fields: [
          {
            type: "email",
            label: "Email:",
            name: "email",
            required: true,
            placeholder: "your@email.com",
          },
          {
            type: "textarea",
            label: "Message:",
            name: "message",
            placeholder: "What's on your mind?",
          },
          { type: "submit" },
        ],
        styles: {
          title: {
            backgroundColor: "gray",
          },
          button: {
            backgroundColor: "gray",
          },
        },
      });
    </script>
  </head>

  <body>
    <!-- Primary Page Layout
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <div class="container">
      <div class="row">
        <div class="column" style="margin-top: 10%">
          <!-- Your Image Here -->
          <img
            src="https://wsrv.nl/?url=avatars.githubusercontent.com/u/4662748?s=242&output=webp&maxage=1y"
            alt="Picture of Jonas Strassel"
            style="border-radius: 50%"
            width="161px"
            height="161px"
          />

          <!-- Title -->
          <h1 class="gradient-name">Jonas Strassel</h1>

          <!-- Short Bio -->
          <p>
            I am a software developer with a passion for creating overly
            complicated things.
          </p>

          <!-- Github -->
          <a
            class="button button-github"
            href="https://github.com/boredland"
            target="_blank"
            rel="noopener"
            ><img
              class="icon"
              src="assets/icons/github.svg"
              alt="GitHub Logo"
            />GitHub</a
          >
          <br />

          <!-- X -->
          <a class="button button-x" href="https://twitter.com/boredland069" target="_blank" rel="noopener" role="button">
            <img class="icon" src="assets/icons/x.svg" alt="">Follow on X
          </a>
          <br />

          <!-- LinkedIn -->
          <a
            class="button button-linked"
            href="https://www.linkedin.com/in/jonas-strasse%E2%80%8Al-392194138/"
            target="_blank"
            rel="noopener"
            ><img
              class="icon"
              src="assets/icons/linkedin.svg"
              alt="LinkedIn Logo"
            />LinkedIn</a
          >
          <br />

          <!-- Discord -->
          <a
            class="button button-discord"
            href="https://discordapp.com/users/boredland#3034"
            target="_blank"
            rel="noopener"
            ><img
              class="icon"
              src="assets/icons/discord.svg"
              alt="Discord Logo"
            />Discord</a
          >
          <br />

          <!-- Matrix -->
          <a class="button button-matrix" href="https://matrix.to/#/@boredland:matrix.org" target="_blank" rel="noopener">
            <img class="icon" src="assets/icons/matrix.svg" alt="Matrix Logo">Matrix</a>
        </div>
      </div>
    </div>
    <img alt="" width="1px" height="1px" src="https://hit.yhype.me/github/profile?user_id=4662748">
    <!-- End Document
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  </body>
</html>
